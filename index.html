<!DOCTYPE html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Karttamaster — SyöteMTB-reittimerkintöjen suunnittelu- ja kenttätyökalu. Järjestäjä suunnittelee opasteet kartalle, talkoolainen merkitsee ne maastossa." />
    <title>Karttamaster</title>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <span id="app-brand">Karttamaster</span>
        <div id="toolbar-actions">
          <button id="btn-home-view" aria-label="Takaisin pätkänäkymään">🏠</button>
          <!-- T308/V219: kartan muokkaustilan toggle. Järjestäjä = karttatyökalurivi (tässä);
               talkoolainen = ⋯-valikon #btn-tk-map-mode (V179-linja) → data-role-hide. -->
          <button id="btn-map-mode" class="map-mode-toggle" data-role-hide="talkoolainen" aria-pressed="false">✎ Muokkaa</button>
          <button id="btn-list">Kaikki merkit</button>
          <button id="btn-menu" aria-label="Tilivalikko">⋯</button>
        </div>
      </div>
      <div id="toolbar-menu">
        <div id="account-menu-section"></div>
        <div id="tk-menu-actions" data-role-hide="järjestäjä">
          <div class="menu-sep"></div>
          <!-- T308/V219: sama MapMode-tila kuin järjestäjän #btn-map-mode (ei rooli-logiikkaa). -->
          <button id="btn-tk-map-mode" class="map-mode-toggle" aria-pressed="false">✎ Muokkaa</button>
          <button id="btn-tk-gps">📍 GPS</button>
          <button id="btn-tk-add-marker">➕ Lisää merkki</button>
          <!-- T351/V254 (B140): #btn-tk-complete POISTETTU — valmis-toggle on hero:n done-rivillä
               (samassa näkymässä kuin "✓ Kaikki asetettu"). ⊥ palauta tänne: kaksi sisääntuloa =
               kaksi label-synkkaa jotka ajautuvat erilleen. -->
        </div>
        <div class="menu-sep"></div>
        <button id="btn-layer">Karttatyyli</button>
        <div id="basemap-dim-container"></div>
        <div class="menu-sep"></div>
        <div id="phase-switcher-container" data-role-hide="talkoolainen"></div>
        <div class="menu-sep"></div>
        <button id="btn-snapshot-panel">Varmuuskopiot</button>
        <div id="gpkg-menu-sep" class="menu-sep"></div>
        <a id="btn-gpkg-export" href="/api/gpkg/export" download>Vie kartta-aineisto</a>
        <button id="btn-gpkg-import">Tuo kartta-aineisto</button>
        <input id="gpkg-file-input" type="file" accept=".gpkg" hidden />
        <span id="gpkg-import-status" class="gpkg-import-status"></span>
      </div>

      <main id="app-main">
        <div id="left-panel">
          <div id="left-panel-header">
            <span class="left-panel-section-title">Suunnittelu</span>
            <button id="left-panel-toggle" aria-label="Sulje paneeli">◀</button>
          </div>
          <div id="left-panel-content">
            <div class="left-panel-section">
              <div id="sign-type-dropdown"></div>
            </div>
            <div class="left-panel-section">
              <div id="segment-panel-container"></div>
            </div>
            <div class="left-panel-section">
              <div id="area-panel-container"></div>
            </div>
            <div class="left-panel-section">
              <a id="btn-inventory-link" class="left-panel-link" href="/inventory.html">📦 Inventaario</a>
            </div>
          </div>
        </div>

        <div id="map-area">
          <!-- T377/V272: suodatinbar — kartan "mitä näkyy" -kontrollit yhdessä paikassa,
               kartan yläpuolella. Aina näkyvissä (⊥ napin takana): suodatettu kartta jonka
               syytä ⊥ näy luetaan kadonneena datana. Renderöidään roolikohtaisesti wiringissä. -->
          <div id="map-filter-bar" hidden></div>
          <!-- T308/V219: pysyvä tilapilleri (sanoin, ei pelkkä väri). Näkyvyys = [hidden]
               map-mode-toggle.ts:stä; accent-kehys = CSS body[data-map-mode="muokkaus"]. -->
          <div id="map-mode-pill" class="map-mode-pill" role="status" hidden>✎ Muokkaustila</div>
          <!-- T335/V243: korostustilan poistumis-affordanssi. Tila kytketään pätkämodaalista,
               joka sulkeutuu — ilman pilleriä käyttäjä jäisi himmennettyyn karttaan ilman
               ulospääsyä (sama umpikuja-luokka kuin B131). -->
          <div id="marker-focus-pill" class="map-mode-pill marker-focus-pill" role="status" hidden>
            <span id="marker-focus-pill-label">Korostus</span>
            <button id="btn-marker-focus-clear" class="marker-focus-pill__clear" type="button" aria-label="Poista korostus">✕</button>
          </div>
          <div id="status-panel"></div>
<div id="segment-view-container"></div>
          <button id="btn-to-map">Kartalle →</button>
          <div id="map"></div>
        </div>

        <!-- T402/V290: järjestäjän merkkijono. TELAKKA #map-arean sisarena, ⊥ modaali:
             rivin klikkaus panoroi kartan ∴ kartta ! pysyä näkyvänä (V114). Avaus = #btn-list. -->
        <div id="marker-overview" hidden></div>
      </main>
    </div>

    <div id="route-bar" hidden>
      <div id="route-bar-main">
        <div id="route-selector"></div>
        <div id="route-bar-top">
          <span id="route-km">0.00 / 0.0 km</span>
          <div id="route-drive-controls">
            <button id="btn-route-prev">◀</button>
            <button id="btn-route-next">▶</button>
            <button id="btn-route-next-marker" title="Hyppää seuraavaan merkkiin">⇥</button>
          </div>
        </div>
      </div>
      <div id="route-track">
        <div id="route-track-fill"></div>
        <div id="route-track-handle"></div>
      </div>
    </div>

    <div id="marker-modal-backdrop"></div>
    <div id="marker-modal">
      <div id="marker-modal-header">
        <h2>Merkkilista (<span id="marker-count">0</span>)</h2>
        <button id="btn-modal-close">✕</button>
      </div>
      <div id="marker-modal-items"></div>
    </div>

    <div id="floating-picker"></div>
    <div id="distance-warning" style="display:none;position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:3000;background:#b45309;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:600;pointer-events:none"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
